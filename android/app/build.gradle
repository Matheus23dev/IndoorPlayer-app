apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Injeta as URLs definidas em .env no BuildConfig usado pelo react-native-config.
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    nodeExecutableAndArgs = [System.getenv('NODE_BINARY') ?: 'node']
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseKeystoreProperties = new Properties()
def releaseKeystorePropertiesFile = rootProject.file('keystore.properties')

if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream { stream ->
        releaseKeystoreProperties.load(stream)
    }
}

def releaseSigningKeys = [
    'storeFile',
    'storePassword',
    'keyAlias',
    'keyPassword',
]

def hasReleaseSigning = releaseSigningKeys.every { key ->
    releaseKeystoreProperties.getProperty(key)?.trim()
}

def requireReleaseSigning =
    providers.gradleProperty('requireReleaseSigning')
        .getOrElse('false')
        .toBoolean()

if (requireReleaseSigning && !hasReleaseSigning) {
    throw new GradleException(
        'Assinatura de produção obrigatória. Configure android/keystore.properties.',
    )
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.indoorplayer"

    defaultConfig {
        applicationId "com.indoorplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.0.14"

        manifestPlaceholders = [
            usesCleartextTraffic: "true"
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(
                    releaseKeystoreProperties.getProperty('storeFile'),
                )
                storePassword releaseKeystoreProperties.getProperty(
                    'storePassword',
                )
                keyAlias releaseKeystoreProperties.getProperty('keyAlias')
                keyPassword releaseKeystoreProperties.getProperty(
                    'keyPassword',
                )
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
